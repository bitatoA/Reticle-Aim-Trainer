<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reticle: 2D Aim Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--p:#101017;--p2:#171722;--ln:#262633;--tx:#e8e8f0;--dim:#8a8aa0;--ac:#ff2d55;--cy:#19f0ff}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg) linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:auto,40px 40px,40px 40px;color:var(--tx);font:500 15px/1.4 'Chakra Petch',system-ui,sans-serif;min-height:100vh;display:flex}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--p2);padding:9px 16px;border-radius:6px;transition:.15s}
button:hover{border-color:var(--ac);transform:translateY(-1px)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}.pri:hover{box-shadow:0 0 26px #ff2d5577}
select{background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:7px 10px}
input[type=color]{width:44px;height:28px;border:0;background:none;padding:0}
nav{width:196px;background:#0a0a10;border-right:1px solid var(--ln);padding:20px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav button{text-align:left;border-color:transparent;background:none;color:var(--dim)}
nav button.on{background:var(--p2);color:#fff;box-shadow:inset 3px 0 var(--ac)}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:22px;padding:0 8px 18px}
main{flex:1;padding:28px;min-width:0}
h1{font-size:32px;line-height:1.1}h2{font-size:18px;margin-bottom:10px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:18px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.big{font-size:30px;font-weight:700}.dim{color:var(--dim)}.mt{margin-top:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .on{background:var(--ac);border-color:var(--ac)}
.mode{text-align:left;line-height:1.35}.mode.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy)}
.hero{display:flex;align-items:center;gap:24px;background:linear-gradient(120deg,#ff2d5522,var(--p) 60%)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}th{color:var(--dim);font-weight:500}
.set{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-top:16px}
.f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--ln)}
.f input[type=range]{width:50%;accent-color:var(--ac)}.f em{font-style:normal;color:var(--cy)}
#pv{width:100%;border-radius:6px;cursor:none;display:block;margin-bottom:12px}
#arena{position:fixed;inset:0;background:#000;z-index:10;cursor:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:26px;padding:12px 18px;pointer-events:none;font-size:18px;align-items:center}
#hud b{color:var(--cy)}#hud button{pointer-events:auto;cursor:pointer;padding:6px 12px}
#hb{position:absolute;top:0;left:0;height:3px;background:var(--ac)}
#ov{position:absolute;inset:0;background:#000d;display:flex;overflow:auto;padding:20px;cursor:default}
#ov .card{margin:auto;width:min(720px,94vw)}
@media(max-width:820px){body{flex-direction:column}nav{width:100%;height:auto;flex-direction:row;overflow-x:auto;z-index:5}.logo{display:none}main{padding:16px}.set{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav><div class="logo"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#ff2d55" stroke-width="2"><circle cx="14" cy="14" r="8"/><path d="M14 1v7M14 20v7M1 14h7M20 14h7"/><circle cx="14" cy="14" r="1.5" fill="#ff2d55"/></svg>Reticle</div>
<button data-go="home">Home</button><button data-go="play">Play</button><button data-go="training">Training</button><button data-go="stats">Stats</button><button data-go="settings">Settings</button></nav>
<main id="main"></main>
<div id="arena" hidden><canvas id="cv"></canvas><div id="hb"></div>
<div id="hud"><span>Score <b id="hs">0</b></span><span>Time <b id="ht">0</b></span><span>Accuracy <b id="ha">0%</b></span><span style="margin-left:auto"></span><button id="bp">Pause</button><button id="bf">Fullscreen</button></div>
<div id="ov" hidden></div></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const clone=o=>JSON.parse(JSON.stringify(o)),rnd=(a,b)=>a+Math.random()*(b-a),fmt=n=>Math.round(n).toLocaleString();
const merge=(a,b)=>{for(const k in b)a[k]&&typeof a[k]=='object'&&typeof b[k]=='object'?merge(a[k],b[k]):a[k]=b[k];return a};
const DEF={t:{shape:'circle',style:'solid',size:1,color:'#19f0ff',border:2,op:1,outline:true,glow:true},
g:{spawn:1,speed:1,inten:1,count:0,dur:30,moving:true,sound:false},
c:{style:'cross',color:'#ffffff',size:12,thick:2,op:1,outline:true,dot:true},
v:{bg:'#07070b',grid:true,fx:true,hit:true,miss:true,fxi:1},
a:{vol:.5,hit:true,miss:true,cd:true,start:true,end:true},cu:{r:24,sp:200,sv:600}};
let S=merge(clone(DEF),ld('ap_s',{})),P=ld('ap_l',{m:'grid',d:2}),R=null,B=[],BN='',F={sf:'all'},cur='home',LR=null;
const hist=()=>ld('ap_h',[]);
const DF=[['Beginner',42,60,1100,2600,0],['Easy',34,110,900,2000,0],['Normal',26,180,700,1500,.1],['Hard',18,280,500,1100,.3],['Extreme',11,420,350,800,.8]];
const dif=i=>i<5?{n:DF[i][0],r:DF[i][1],sp:DF[i][2],sv:DF[i][3],life:DF[i][4],jit:DF[i][5]}:{n:'Custom',r:S.cu.r,sp:S.cu.sp,sv:S.cu.sv,life:S.cu.sv*2.4,jit:.2};
const MK=['grid','micro','track','flick','react','multi','prec'];
const MODES={grid:{n:'Gridshot',d:'Fast clicking on a 3x3 field. Targets respawn as you clear them.',n0:3,rm:1},
micro:{n:'Microshot',d:'Small targets with short lifespans. Flick and commit.',n0:2,rm:.55},
track:{n:'Tracking',d:'Keep your cursor on a moving target. No clicking needed.',n0:1,rm:1.3},
flick:{n:'Flickshot',d:'One target, always far from your cursor.',n0:1,rm:.9},
react:{n:'Reaction',d:'Wait for the target to appear, then click as fast as you can.',n0:1,rm:1.4},
multi:{n:'Multishot',d:'Clear the whole wave before the next one lands.',n0:4,rm:.85},
prec:{n:'Precision',d:'Tiny targets. Every miss costs you.',n0:1,rm:.4}};
const dly=()=>{const d=new Date().toISOString().slice(0,10);let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;return{d,m:MK[h%7],di:1+(h>>3)%4}};

/* ---------- audio ---------- */
let AC;const beep=k=>{if(!S.g.sound||!S.a[k])return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),f={hit:[880,.06,'sine'],miss:[140,.1,'square'],cd:[520,.09,'triangle'],start:[1040,.2,'sine'],end:[330,.35,'triangle']}[k],t=AC.currentTime;o.type=f[2];o.frequency.value=f[0];g.gain.setValueAtTime(Math.max(.0002,S.a.vol*.3),t);g.gain.exponentialRampToValueAtTime(.0001,t+f[1]);o.connect(g).connect(AC.destination);o.start();o.stop(t+f[1])}catch{}};

/* ---------- drawing (shared by game + live preview) ---------- */
function shape(c,x,y,r){c.beginPath();const s=S.t.shape;if(s=='circle')c.arc(x,y,r,0,6.283);else if(s=='square')c.rect(x-r*.85,y-r*.85,r*1.7,r*1.7);else{c.moveTo(x,y-r*1.2);c.lineTo(x+r*1.2,y);c.lineTo(x,y+r*1.2);c.lineTo(x-r*1.2,y);c.closePath()}}
function drawT(c,x,y,r,k=1){const T=S.t;if(r<=0)return;c.save();c.globalAlpha=T.op*k;if(T.glow){c.shadowColor=T.color;c.shadowBlur=18*S.v.fxi}
 shape(c,x,y,r);if(T.style=='ring'){c.lineWidth=Math.max(3,r*.22);c.strokeStyle=T.color;c.stroke()}else{c.fillStyle=T.color;c.fill();if(T.style=='bullseye'){c.shadowBlur=0;[.66,.33].forEach((f,i)=>{shape(c,x,y,r*f);c.fillStyle=i?'#fff':'#000a';c.fill()})}}
 c.shadowBlur=0;if(T.border>0){shape(c,x,y,r);c.lineWidth=T.border;c.strokeStyle='#ffffffcc';c.stroke()}
 if(T.outline){shape(c,x,y,r+T.border/2+1.5);c.lineWidth=1.5;c.strokeStyle='#000';c.stroke()}c.restore()}
function drawX(c,x,y){const C=S.c,s=C.size,g=C.style=='gap'?s*.4:0,d=C.style=='dot';c.save();c.globalAlpha=C.op;
 const ln=(col,w)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();if(C.style=='circle')c.arc(x,y,s,0,6.283);else if(!d)for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){c.moveTo(x+a*g,y+b*g);c.lineTo(x+a*s,y+b*s)}c.stroke()};
 const dt=(col,r)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,6.283);c.fill()};
 if(C.outline){ln('#000',C.thick+2);if(C.dot||d)dt('#000',C.thick+1.5)}ln(C.color,C.thick);if(C.dot||d)dt(C.color,Math.max(1.5,C.thick*.7));c.restore()}
function drawBg(c,w,h){c.fillStyle=S.v.bg;c.fillRect(0,0,w,h);
 if(S.v.fx){const g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.7);g.addColorStop(0,'#ff2d5512');g.addColorStop(1,'#0000');c.fillStyle=g;c.fillRect(0,0,w,h)}
 if(S.v.grid){c.strokeStyle='#ffffff0d';c.lineWidth=1;c.beginPath();for(let x=0;x<w;x+=48){c.moveTo(x,0);c.lineTo(x,h)}for(let y=0;y<h;y+=48){c.moveTo(0,y);c.lineTo(w,y)}c.stroke()}}

/* ---------- game engine ---------- */
const cv=$('#cv'),cx=cv.getContext('2d'),ar=$('#arena'),ov=$('#ov');let WW=0,HH=0,mx=0,my=0,G=null,raf=0,last=0;
new ResizeObserver(()=>{const d=devicePixelRatio||1;WW=ar.clientWidth;HH=ar.clientHeight;cv.width=WW*d;cv.height=HH*d;cx.setTransform(d,0,0,d,0,0)}).observe(ar);
const rad=t=>t.r0*S.t.size;
const ins=t=>{const dx=Math.abs(mx-t.x),dy=Math.abs(my-t.y),r=rad(t),s=S.t.shape;return s=='circle'?dx*dx+dy*dy<=r*r:s=='square'?dx<=r*.85&&dy<=r*.85:dx+dy<=r*1.2};
const acc=()=>{const s=G.hit+G.mis;return s?G.hit/s:0};
function start(m,di,dur,o={}){ov.hidden=true;ar.hidden=false;document.body.style.overflow='hidden';
 G={m,di,dur,o,t:0,st:'cd',cd:3000,cdn:4,ts:[],fx:[],sc:0,hit:0,mis:0,exp:0,str:0,best:0,rts:[],bk:Array(Math.ceil(dur/5)).fill(0),on:0,tk:0,was:false,lost:0,cur:0,rs:'wait',rt0:rnd(800,2500),wait:0,ws:0,acc:1e9};
 last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(now){if(!G)return;const dt=Math.min(50,now-last);last=now;
 if(G.st=='cd'){G.cd-=dt;const n=Math.ceil(G.cd/1000);if(n!=G.cdn){G.cdn=n;beep('cd')}if(G.cd<=0){G.st='run';beep('start')}}
 else if(G.st=='run'){upd(dt);if(G.t>=G.dur*1000)return end()}
 draw();hud();raf=requestAnimationFrame(loop)}
function spawn(){const D=dif(G.di),r0=Math.max(3,D.r*MODES[G.m].rm),p=r0*S.t.size*1.2+6;let x,y,cell=-1;
 if(G.m=='grid'){const u=G.ts.map(t=>t.cell);do cell=Math.random()*9|0;while(u.includes(cell)&&u.length<9);x=WW*(cell%3+.5)/3+rnd(-1,1)*WW/14;y=60+(HH-80)*((cell/3|0)+.5)/3+rnd(-1,1)*(HH-80)/14}
 else{let k=0;do{x=rnd(p,WW-p);y=rnd(p+50,HH-p)}while(G.m=='flick'&&Math.hypot(x-mx,y-my)<Math.min(WW,HH)*.35&&k++<40)}
 const a=rnd(0,6.283);G.ts.push({x,y,r0,cell,ux:Math.cos(a),uy:Math.sin(a),born:G.t,life:{grid:1e9,track:1e9,multi:1e9,micro:D.life*.8,flick:D.life*1.5,react:3000,prec:D.life*2.5}[G.m]})}
function upd(dt){const D=dif(G.di),M=MODES[G.m],s=dt/1000,n=S.g.count||M.n0+(G.m=='multi'?G.di>>1:0);G.t+=dt;
 const sm=G.m=='track'?1:G.m=='react'?0:S.g.moving?(G.m=='prec'?.25:.4):0;
 for(const t of G.ts)if(sm){if(Math.random()<(D.jit*2+.15)*S.g.inten*s){const a=Math.atan2(t.uy,t.ux)+rnd(-.5,.5)*(1+D.jit*4);t.ux=Math.cos(a);t.uy=Math.sin(a)}
  const v=D.sp*S.g.speed*sm,q=rad(t);t.x+=t.ux*v*s;t.y+=t.uy*v*s;
  if(t.x<q||t.x>WW-q){t.ux=-t.ux;t.x=Math.min(WW-q,Math.max(q,t.x))}if(t.y<q+44||t.y>HH-q){t.uy=-t.uy;t.y=Math.min(HH-q,Math.max(q+44,t.y))}}
 for(let i=G.ts.length;i--;){const t=G.ts[i];if(G.t-t.born>t.life){G.ts.splice(i,1);G.exp++;G.str=0;if(G.m=='react'){G.rs='wait';G.rt0=rnd(800,2500);G.wait=0}}}
 if(G.m=='track'){const on=G.ts.some(ins);G.tk+=dt;if(on){G.on+=dt;G.cur+=dt;G.best=Math.max(G.best,G.cur);G.sc+=dt*.12*(1+Math.min(G.cur,3000)/3000);if(!G.was)G.rts.push(G.t-G.lost)}else{G.cur=0;if(G.was)G.lost=G.t}G.was=on}
 if(G.m=='react'){G.wait+=dt;if(G.rs=='wait'&&G.wait>=G.rt0){G.rs='go';spawn()}}
 else if(G.m=='multi'){if(!G.ts.length){G.wait+=dt;if(G.wait>=D.sv/S.g.spawn){for(let i=0;i<n;i++)spawn();G.ws=G.t;G.wait=0}}}
 else{G.acc+=dt;if(G.ts.length<n&&G.acc>=D.sv*(G.m=='grid'?.15:1)/S.g.spawn){spawn();G.acc=0}}
 for(const f of G.fx)f.a+=dt;G.fx=G.fx.filter(f=>f.a<450)}
const miss=()=>{G.mis++;G.str=0;G.sc=Math.max(0,G.sc-(G.m=='prec'?60:20));beep('miss');if(S.v.miss)G.fx.push({k:'m',x:mx,y:my,a:0})};
function clk(){if(!G||G.st!='run'||G.m=='track')return;
 if(G.m=='react'&&G.rs=='wait'){G.rt0=rnd(800,2500);G.wait=0;return miss()}
 const i=G.ts.findLastIndex(ins);if(i<0)return miss();
 const t=G.ts.splice(i,1)[0],rt=G.t-t.born;G.hit++;G.str++;G.best=Math.max(G.best,G.str);G.rts.push(rt);G.bk[Math.min(G.bk.length-1,G.t/5e3|0)]++;
 let p=G.m=='react'?Math.max(50,1000-rt*1.5):(100+Math.min(G.str,20)*5+Math.max(0,1-rt/1500)*60)*({prec:2,micro:1.3,flick:1.2}[G.m]||1);
 if(G.m=='multi'&&!G.ts.length){p+=Math.max(0,3000-(G.t-G.ws))/10+50;G.wait=0}
 if(G.m=='react'){G.rs='wait';G.rt0=rnd(800,2500);G.wait=0}
 G.sc+=p;beep('hit');if(S.v.hit)G.fx.push({k:'h',x:t.x,y:t.y,r:rad(t),a:0,c:S.t.color})}
function draw(){const c=cx;drawBg(c,WW,HH);
 if(G.st=='cd'){c.fillStyle='#fff';c.font='700 120px Chakra Petch,sans-serif';c.textAlign='center';c.fillText(Math.ceil(G.cd/1000),WW/2,HH/2+40)}
 if(G.st=='run'&&G.m=='react'&&G.rs=='wait'){c.fillStyle='#8a8aa0';c.font='700 24px Chakra Petch,sans-serif';c.textAlign='center';c.fillText('Wait for the target',WW/2,HH/2)}
 for(const t of G.ts){const age=G.t-t.born,left=t.life-age;drawT(c,t.x,t.y,rad(t)*Math.min(1,age/100),left<300?left/300:1)}
 for(const f of G.fx){const p=f.a/450;c.globalAlpha=1-p;
  if(f.k=='h'){c.strokeStyle=f.c;c.lineWidth=2;c.beginPath();c.arc(f.x,f.y,f.r+p*30*S.v.fxi,0,6.283);c.stroke();const n=Math.round(8*S.v.fxi);c.fillStyle=f.c;for(let i=0;i<n;i++){const a=i/n*6.283,d=f.r*.5+p*45*S.v.fxi;c.fillRect(f.x+Math.cos(a)*d-2,f.y+Math.sin(a)*d-2,4,4)}}
  else{c.strokeStyle='#ff2d55';c.lineWidth=3;c.beginPath();c.moveTo(f.x-7,f.y-7);c.lineTo(f.x+7,f.y+7);c.moveTo(f.x+7,f.y-7);c.lineTo(f.x-7,f.y+7);c.stroke()}c.globalAlpha=1}
 if(G.st!='pause')drawX(c,mx,my)}
function hud(){$('#hs').textContent=fmt(G.sc);$('#ht').textContent=G.st=='cd'?G.dur:Math.max(0,Math.ceil((G.dur*1000-G.t)/1000));$('#ha').textContent=Math.round((G.m=='track'?(G.tk?G.on/G.tk:0):acc())*100)+'%';$('#hb').style.width=G.t/G.dur/10+'%'}
const bars=(v,h=70)=>{const m=Math.max(1,...v);return`<svg viewBox="0 0 ${v.length*14} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${v.map((y,i)=>`<rect x="${i*14+1}" y="${h-y/m*(h-4)}" width="11" height="${y/m*(h-4)}" fill="#ff2d55"/>`).join('')}</svg>`};
const line=(v,c='#19f0ff',w=300,h=80)=>{if(v.length<2)return'<p class="dim">Play two or more sessions to see a trend.</p>';const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline points="${v.map((y,i)=>`${i*w/(v.length-1)},${h-6-(y-mn)/r*(h-12)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`};
const stat=(l,v)=>`<div class="card"><div class="dim">${l}</div><div class="big">${v}</div></div>`;
function end(){cancelAnimationFrame(raf);G.st='end';beep('end');const tr=G.m=='track',el=G.t/1000,hit=tr?Math.round(G.on/100):G.hit,mis=tr?Math.round((G.tk-G.on)/100):G.mis+G.exp,a=tr?(G.tk?G.on/G.tk:0):acc(),rt=G.rts.length?G.rts.reduce((x,y)=>x+y,0)/G.rts.length:0;
 const r=LR={ts:Date.now(),m:G.m,di:G.di,dur:G.dur,score:Math.round(G.sc),hit,mis,acc:a,rt,avg:tr||!hit?0:el/hit,streak:tr?G.best/1000:G.best,tpm:tr?0:hit/el*60};
 const hs=hist(),pb=hs.filter(s=>s.m==r.m&&s.di==r.di).reduce((x,s)=>Math.max(x,s.score),-1);hs.push(r);sv('ap_h',hs.slice(-300));
 if(G.o.daily){const d=ld('ap_d',{}),k=dly().d;sv('ap_d',{d:k,best:d.d==k?Math.max(d.best||0,r.score):r.score})}
 const nx=R&&R.i<R.steps.length-1;ov.hidden=false;
 ov.innerHTML=`<div class="card"><h2>${MODES[r.m].n} on ${dif(r.di).n}, ${r.dur}s${R?' ('+R.n+', drill '+(R.i+1)+' of '+R.steps.length+')':''}</h2><div class="big" style="font-size:56px">${fmt(r.score)}</div>
 <p style="color:${pb<0||r.score>pb?'var(--cy)':'var(--dim)'}">${pb<0?'First run on this setup.':r.score>pb?'New personal best, up from '+fmt(pb)+'.':fmt(pb-r.score)+' short of your best ('+fmt(pb)+').'}</p>
 <div class="g g4 mt">${stat('Targets hit',r.hit)}${stat('Targets missed',r.mis)}${stat('Accuracy',Math.round(a*100)+'%')}${stat('Avg reaction',rt?Math.round(rt)+' ms':'-')}${stat('Avg per target',r.avg?r.avg.toFixed(2)+'s':'-')}${stat('Best streak',tr?r.streak.toFixed(1)+'s on target':r.streak)}${stat('Targets/min',r.tpm?r.tpm.toFixed(0):'-')}${stat('Score',fmt(r.score))}</div>

 <div class="seg mt">${nx?'<button class="pri" data-o="next">Next drill ('+(R.i+2)+' of '+R.steps.length+')</button>':'<button class="pri" data-o="again">Play again</button>'}${nx?'<button data-o="again">Repeat drill</button>':''}<button data-o="menu">Menu</button><button data-o="stats">View stats</button></div></div>`}

ov.onclick=e=>{const o=e.target.dataset.o;if(!o)return;
 if(o=='resume'){G.st='run';ov.hidden=true}else if(o=='again')start(G.m,G.di,G.dur,G.o);else if(o=='next'){R.i++;runStep()}else if(o=='menu')quit();else if(o=='stats'){cur='stats';quit()}};

addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
cv.onmousedown=e=>{e.preventDefault();if(e.button==0)clk()};ar.oncontextmenu=e=>e.preventDefault();

addEventListener('keydown',e=>{if(!G)return;if(e.key=='Escape'||e.key=='p'||e.key=='P'){if(G.st=='run')pause();else if(G.st=='pause'){G.st='run';ov.hidden=true}}});

const MO=MK.map(k=>[k,MODES[k].n]),DO=[0,1,2,3,4,5].map(i=>[i,dif(i).n]),TO=[15,30,60,90,120].map(d=>[d,d+'s']);

const V={
home(){const h=hist(),dl=dly(),dv=ld('ap_d',{}),done=dv.d==dl.d,l=h.at(-1),tt=h.reduce((a,s)=>a+s.dur,0),ac=h.length?h.reduce((a,s)=>a+s.acc,0)/h.length:0;
 return`<h1>Train like it counts</h1><p class="dim" style="margin:6px 0 20px">${l?'Last session: '+MODES[l.m].n+', '+fmt(l.score)+' points at '+Math.round(l.acc*100)+'% accuracy.':'No sessions yet. Your first run sets the baseline.'}</p>
 <div class="g g2"><div class="card hero"><svg width="92" height="92" viewBox="0 0 28 28" fill="none" stroke="#ff2d55" stroke-width="1.2"><circle cx="14" cy="14" r="8" stroke="#19f0ff"/><path d="M14 1v7M14 20v7M1 14h7M20 14h7"/><circle cx="14" cy="14" r="1.5" fill="#ff2d55"/></svg><div><button class="pri" data-a="now" style="font-size:22px;padding:14px 34px">PLAY NOW</button><p class="dim" style="margin-top:8px">${MODES[P.m].n}, ${dif(P.d).n}, ${S.g.dur}s</p></div></div>
 <div class="card"><h2>Daily challenge</h2><p>${MODES[dl.m].n}, ${dif(dl.di).n}, 30s</p><p class="dim" style="margin:4px 0 12px">${done?'Today\'s best: '+fmt(dv.best):'Not played yet today.'}</p><button data-a="daily">${done?'Beat your score':'Start challenge'}</button></div></div>
 <div class="g g4 mt">${stat('Best score',fmt(Math.max(0,...h.map(s=>s.score))))}${stat('Training time',Math.floor(tt/60)+'m '+tt%60+'s')}${stat('Avg accuracy',Math.round(ac*100)+'%')}${stat('Sessions',h.length)}</div>
 <div class="card mt"><h2>Recent performance</h2>${line(h.slice(-12).map(s=>s.score))}</div>
 <h2 class="mt">Quick play and personal bests</h2><div class="g g4">${MK.map(k=>`<button class="mode" data-a="quick" data-v="${k}"><b>${MODES[k].n}</b><br><span class="dim">Best ${fmt(bo(k))}</span></button>`).join('')}</div>`},
play(){const D=dif(P.d);return`<h1>Play</h1><h2 class="mt">Mode</h2><div class="g g2">${MK.map(k=>`<button class="mode ${P.m==k?'on':''}" data-a="pm" data-v="${k}"><b>${MODES[k].n}</b><br><span class="dim">${MODES[k].d}</span></button>`).join('')}</div>
 <h2 class="mt">Difficulty</h2><div class="seg">${DO.map(([i,n])=>`<button class="${P.d==i?'on':''}" data-a="pd" data-v="${i}">${n}</button>`).join('')}</div>
 <p class="dim" style="margin:8px 0">Target radius ${D.r}px, drift speed ${D.sp}px/s, new target every ${D.sv}ms, lifespan ${Math.round(D.life)}ms.</p>
 <h2 class="mt">Duration</h2><div class="seg">${TO.map(([d,l])=>`<button class="${S.g.dur==d?'on':''}" data-a="pdur" data-v="${d}">${l}</button>`).join('')}</div>
 <p class="mt"><button class="pri" data-a="now" style="font-size:20px;padding:14px 40px">Start</button></p>`},
training(){const cu=ld('ap_r',[]),card=(r,i,c)=>`<div class="card"><h2>${r[0]}</h2><p class="dim">${r[1]}</p><ol style="margin:8px 0 12px 18px">${r[2].map(s=>`<li>${MODES[s[0]].n}, ${dif(s[1]).n}, ${s[2]}s</li>`).join('')}</ol><button class="pri" data-a="rt" data-v="${c?'c':'b'}${i}">Start routine</button>${c?` <button data-a="rdel" data-v="${i}">Delete</button>`:''}</div>`;
 return`<h1>Training</h1><div class="g g2 mt">${RT.map((r,i)=>card(r,i)).join('')}${cu.map((r,i)=>card(r,i,1)).join('')}</div>
 <div class="card mt"><h2>Build your own routine</h2><div class="seg" style="align-items:center"><input id="bn" placeholder="Routine name" value="${BN}" style="background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:8px 10px"><select id="bm">${opts(MO)}</select><select id="bd">${opts(DO)}</select><select id="bt">${opts(TO)}</select><button data-a="radd">Add drill</button></div>
 <ol style="margin:12px 0 12px 18px">${B.map((s,i)=>`<li>${MODES[s[0]].n}, ${dif(s[1]).n}, ${s[2]}s <button data-a="rrm" data-v="${i}" style="padding:2px 8px">Remove</button></li>`).join('')||'<li class="dim" style="list-style:none">No drills yet. Add at least one.</li>'}</ol><button class="pri" data-a="rsave">Save routine</button></div>`},
stats(){const all=hist(),h=F.sf=='all'?all:all.filter(s=>s.m==F.sf),tt=h.reduce((a,s)=>a+s.dur,0),ac=h.length?h.reduce((a,s)=>a+s.acc,0)/h.length:0;
 return`<h1>Stats</h1><p style="margin:12px 0"><select id="sf"><option value="all">All modes</option>${MO.map(([k,n])=>`<option value="${k}" ${F.sf==k?'selected':''}>${n}</option>`).join('')}</select></p>
 <div class="g g4">${stat('Sessions',h.length)}${stat('Best score',fmt(Math.max(0,...h.map(s=>s.score))))}${stat('Avg accuracy',Math.round(ac*100)+'%')}${stat('Time trained',Math.floor(tt/60)+'m '+tt%60+'s')}</div>
 <div class="g g2 mt"><div class="card"><h2>Score trend (last 30)</h2>${line(h.slice(-30).map(s=>s.score))}</div><div class="card"><h2>Accuracy trend (last 30)</h2>${line(h.slice(-30).map(s=>s.acc*100),'#ff2d55')}</div></div>
 <div class="card mt"><h2>By game mode</h2>${tb(['Mode','Plays','Best','Avg accuracy','Avg reaction'],MK.map(k=>{const m=all.filter(s=>s.m==k),r=m.filter(s=>s.rt);return[MODES[k].n,m.length,fmt(bo(k)),m.length?Math.round(m.reduce((a,s)=>a+s.acc,0)/m.length*100)+'%':'-',r.length?Math.round(r.reduce((a,s)=>a+s.rt,0)/r.length)+' ms':'-']}))}</div>
 <div class="card mt"><h2>Session history</h2>${h.length?tb(['Date','Mode','Difficulty','Score','Accuracy','Hits'],h.slice(-12).reverse().map(s=>[new Date(s.ts).toLocaleDateString(),MODES[s.m].n,dif(s.di).n,fmt(s.score),Math.round(s.acc*100)+'%',s.hit])):'<p class="dim">Nothing here yet. Finish a session and it shows up.</p>'}</div>
 <p class="mt"><button data-a="clr">Clear all data</button></p>`},
settings(){return`<h1>Settings</h1><div class="set"><div class="g">${SC.map(([t,fs])=>`<div class="card"><h2>${t}</h2>${fs.map(field).join('')}</div>`).join('')}</div>
 <aside><div class="card" style="position:sticky;top:16px"><h2>Live preview</h2><canvas id="pv" width="360" height="260"></canvas><button data-a="reset">Reset to default</button><p class="dim" style="margin-top:8px">Changes save instantly and apply to the next frame of any session.</p></div></aside></div>`}};
const RT=[['Beginner routine','Land your first clean sessions.',[['grid',0,30],['micro',1,30],['track',0,30],['react',0,30]]],
['Flick routine','Long-range snaps and wave clearing.',[['flick',1,30],['flick',2,30],['flick',3,30],['multi',2,30]]],
['Tracking routine','Smooth cursor control, getting faster.',[['track',1,30],['track',2,30],['track',3,30]]],
['Precision routine','Small targets, slow and exact.',[['prec',1,30],['prec',2,30],['micro',2,30]]],
['Reaction routine','Cold-start reflexes.',[['react',1,30],['react',2,30],['react',3,30]]],
['Advanced FPS warm-up','Six drills, one of each skill, all on Hard.',[['grid',2,30],['track',3,30],['flick',3,30],['micro',3,30],['prec',3,30],['multi',3,30]]]];

['Gameplay',[['g','spawn','Spawn rate','rng',.4,3,.1],['g','speed','Target speed','rng',.2,3,.1],['g','inten','Movement intensity','rng',0,3,.1],['g','count','Simultaneous targets (0 = mode default)','rng',0,9,1],['g','dur','Duration (seconds)','sel',[15,30,60,90,120]],['g','moving','Moving targets','tog'],['g','sound','Sound effects','tog']]],
['Custom difficulty',[['cu','r','Target radius','rng',4,60,1],['cu','sp','Speed','rng',0,600,10],['cu','sv','Spawn interval (ms)','rng',150,1500,50]]],
['Crosshair',[['c','style','Style','sel',['cross','gap','circle','dot']],['c','color','Color','col'],['c','size','Size','rng',2,40,1],['c','thick','Thickness','rng',1,8,1],['c','op','Opacity','rng',.2,1,.05],['c','outline','Outline','tog'],['c','dot','Center dot','tog']]],
['Visuals',[['v','bg','Background color','col'],['v','grid','Background grid','tog'],['v','fx','Background effects','tog'],['v','hit','Hit animations','tog'],['v','miss','Miss indicators','tog'],['v','fxi','Effects intensity','rng',0,2,.1]]],

function field([g,k,l,t,...o]){const v=S[g][k],d=`data-g="${g}" data-k="${k}"`;
 return`<label class="f"><span>${l}${t=='rng'?` <em id="v-${g}-${k}">${v}</em>`:''}</span>${t=='rng'?`<input type="range" ${d} min="${o[0]}" max="${o[1]}" step="${o[2]}" value="${v}">`:t=='sel'?`<select ${d}>${o[0].map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:t=='col'?`<input type="color" ${d} value="${v}">`:`<input type="checkbox" ${d} ${v?'checked':''}>`}</label>`}

 [[80,90,1],[190,70,.8],[280,150,1.2]].forEach(([a,b,k])=>drawT(x,a,b,22*k*S.t.size,1));

const act={now:()=>start(P.m,P.d,S.g.dur),quick:v=>{P.m=v;sv('ap_l',P);start(v,P.d,S.g.dur)},daily:()=>{const d=dly();start(d.m,d.di,30,{daily:1})},
